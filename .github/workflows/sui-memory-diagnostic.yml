name: Sui scratch memory comparison
on:
  push:
    branches: [diagnostic/sui-memory-20261121]
    paths: [.github/workflows/sui-memory-diagnostic.yml]
permissions: {}
concurrency:
  group: sui-scratch-memory
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      actions: read
    steps:
      - name: Fetch exact existing portable build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sui-1.74.1-linux-amd64-portable
          path: ${{ runner.temp }}/sui-memory-input
          run-id: '44792562374'
          github-token: ${{ github.token }}
      - name: Compare two fresh local topologies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          binary="$RUNNER_TEMP/sui-memory-input/sui"
          test -f "$binary" && test ! -L "$binary"
          printf '%s  %s\n' 8c5ad9388dd713a4ab5e993212e503e55c44ab1b6dce6ac3786cd8fa16002698 "$binary" | sha256sum --check --status
          chmod 700 "$binary"
          test "$(env -i PATH=/usr/bin:/bin "$binary" --version)" = 'sui 1.74.1-8fc60f1fa966'
          python3 - "$binary" <<'PY'
          import os, pathlib, re, shutil, signal, subprocess, sys, tempfile, time, urllib.error, urllib.request

          GiB = 1024 ** 3
          binary = sys.argv[1]
          run_seconds = 45 * 60
          epoch_ms = 60000  # Scratch default; this experiment is not a retained-ledger replay.
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          local_http = urllib.request.build_opener(urllib.request.ProxyHandler({}))

          def fields(path):
              result = {}
              for line in pathlib.Path(path).read_text().splitlines():
                  name, _, value = line.partition(":")
                  first = value.split()[:1]
                  if first and first[0].isdigit():
                      result[name] = int(first[0]) * 1024
              return result

          def vm_ok():
              return (fields("/proc/meminfo")["MemAvailable"] >= 2 * GiB
                      and shutil.disk_usage(root).free >= 2 * GiB)

          def progress(ports):
              values = []
              for port in ports:
                  try:
                      with local_http.open(f"http://127.0.0.1:{port}/metrics", timeout=1) as f:
                          payload = f.read(8 * 1024 * 1024).decode("utf-8", errors="replace")
                  except (OSError, urllib.error.URLError):
                      continue
                  m = re.search(r"(?m)^last_certified_checkpoint(?:\{[^\n]*\})? ([0-9]+)(?:\.0+)?$", payload)
                  if m:
                      values.append(int(m[1]))
              return str(min(values)) if len(values) == 4 else "unavailable"

          def stop(proc):
              if proc.poll() is None:
                  os.killpg(proc.pid, signal.SIGTERM)
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait(timeout=10)

          def run_case(label, extra):
              if not vm_ok() or shutil.disk_usage(root).free < 5 * GiB:
                  return "resource-preflight"
              with tempfile.TemporaryDirectory(prefix="sui-memory-", dir=root) as path:
                  scratch = pathlib.Path(path)
                  configs = scratch / "config"
                  configs.mkdir()
                  env = {"PATH": "/usr/bin:/bin", "HOME": path, "TMPDIR": path, "RUST_LOG": "error"}
                  g = subprocess.run(
                      [binary, "genesis", "--working-dir", str(configs), "--committee-size", "4",
                       "--epoch-duration-ms", str(epoch_ms)], cwd=path, env=env,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=100)
                  if g.returncode:
                      return f"genesis-exit-{g.returncode}"
                  config_text = (configs / "network.yaml").read_text()
                  ports = [int(p) for p in re.findall(
                      r"(?m)^\s+metrics-address: ['\"]?(?:127\.0\.0\.1|0\.0\.0\.0):([0-9]+)",
                      config_text)]
                  proc = subprocess.Popen(
                      [binary, "start", "--network.config", str(configs), *extra],
                      cwd=path, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      start_new_session=True)
                  started = time.monotonic()
                  sample = 0
                  try:
                      while True:
                          rc = proc.poll()
                          if rc is not None:
                              return f"sui-exit-{rc}"
                          try:
                              mem = fields(f"/proc/{proc.pid}/status")
                          except FileNotFoundError:
                              return "sui-exited"
                          rss = mem.get("VmRSS", 0)
                          elapsed = int(time.monotonic() - started)
                          if elapsed >= sample:
                              print(label, elapsed, rss // 1048576,
                                    mem.get("RssAnon", 0) // 1048576,
                                    mem.get("RssFile", 0) // 1048576,
                                    progress(ports) if len(ports) == 4 else "unavailable", flush=True)
                              sample += 60
                          if rss >= int(11.5 * GiB) or not vm_ok():
                              return "resource-guard"
                          if elapsed >= run_seconds:
                              return "window-complete"
                          time.sleep(5)
                  finally:
                      stop(proc)

          print(f"Fresh scratch only; 4 validators; epoch_ms={epoch_ms}; no external clients or transactions", flush=True)
          print("case elapsed_s rss_MiB anon_MiB file_MiB min_certified_checkpoint", flush=True)
          failures = 0
          for label, flags in (("validators-only", ["--no-full-node"]), ("with-fullnode", [])):
              try:
                  outcome = run_case(label, flags)
              except (OSError, subprocess.TimeoutExpired):
                  outcome = "local-diagnostic-error"
              print(f"{label} outcome={outcome}", flush=True)
              failures += int(outcome not in ("window-complete", "resource-guard"))
          sys.exit(bool(failures))
          PY
